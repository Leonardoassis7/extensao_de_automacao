<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>PreencheJa</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Automacao Pro</h1>
      <button class="settings-btn" title="Configuracoes">CFG</button>
    </header>

    <section class="upload-section">
      <label for="excel-file">Excel (opcional)</label>
      <div class="drop-zone">
        <span class="drop-icon">UP</span>
        <p>Arraste ou clique para selecionar</p>
        <input type="file" id="excel-file" hidden accept=".xlsx,.xls">
      </div>
      <p id="excel-status" class="hint">Nenhum arquivo carregado</p>
    </section>

    <section class="controls-section">
      <h3>Controles de Gravacao</h3>
      <div class="button-row">
        <button id="start-btn" class="btn btn-primary">
          <span>></span> Iniciar Gravacao
        </button>
        <button id="stop-btn" class="btn btn-secondary">
          <span>[]</span> Parar Gravacao
        </button>
      </div>
      <button id="run-btn" class="btn btn-primary">
        <span>></span> Rodar Automacao
      </button>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 45%;"></div>
      </div>
    </section>

    <section class="library-section">
      <div class="library-header">
        <h3>Biblioteca</h3>
        <select id="automation-select">
          <option>Selecionar automacao...</option>
        </select>
      </div>
      <div class="automation-list">
        <!-- Automations serao populadas via JS -->
      </div>
    </section>

    <button id="delete-main-btn" class="btn btn-danger">
      <span>Deletar Automacao</span> 
    </button>

    <footer>
      <span class="status-dot"></span>
      <span id="status-text">Status: Pronto</span>
    </footer>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
